<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAP Korea 점심 메뉴</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      background: #f0f4f8;
      color: #1a1a2e;
      min-height: 100vh;
      padding: 32px 16px 48px;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 36px;
    }
    header h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #1a1a2e;
    }
    .date-badge {
      display: inline-block;
      margin-top: 10px;
      background: #ffffff;
      border: 1px solid #dde3ec;
      border-radius: 20px;
      padding: 5px 16px;
      font-size: 0.88rem;
      color: #5a6a7e;
      font-weight: 500;
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 980px;
      margin: 0 auto;
    }

    /* ── Card ── */
    .card {
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.07);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.11);
    }

    .card-header {
      padding: 18px 22px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-header h2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.2px;
    }

    /* 식당별 헤더 색상 */
    .card:nth-child(1) .card-header { background: linear-gradient(135deg, #1976D2, #42A5F5); }
    .card:nth-child(2) .card-header { background: linear-gradient(135deg, #388E3C, #66BB6A); }
    .card:nth-child(3) .card-header { background: linear-gradient(135deg, #E64A19, #FF7043); }

    .card-body {
      padding: 6px 22px 18px;
      flex: 1;
    }

    /* ── Menu item ── */
    .menu-item {
      padding: 12px 0;
      border-bottom: 1px solid #f2f4f7;
    }
    .menu-item:last-child { border-bottom: none; }

    .corner-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 12px;
      margin-bottom: 5px;
      letter-spacing: 0.3px;
    }
    .card:nth-child(1) .corner-badge { background: #E3F2FD; color: #1565C0; }
    .card:nth-child(2) .corner-badge { background: #E8F5E9; color: #2E7D32; }
    .card:nth-child(3) .corner-badge { background: #FBE9E7; color: #BF360C; }

    .menu-name {
      font-size: 0.97rem;
      font-weight: 700;
      color: #1a1a2e;
      line-height: 1.4;
    }
    .menu-sides {
      margin-top: 5px;
      font-size: 0.8rem;
      color: #8a96a8;
      line-height: 1.55;
    }

    /* ── Empty / Loading / Error ── */
    .state {
      text-align: center;
      padding: 64px 24px;
      color: #8a96a8;
      font-size: 0.95rem;
      max-width: 980px;
      margin: 0 auto;
    }
    .state .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #dde3ec;
      border-top-color: #1976D2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    footer {
      text-align: center;
      margin-top: 32px;
      font-size: 0.8rem;
      color: #b0bac8;
    }
    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 28px;
      padding: 10px 22px;
      background: #1976D2;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .refresh-btn:hover { background: #1565C0; }

    .no-menu { color: #b0bac8; font-size: 0.88rem; padding: 12px 0; }

    .card-link {
      display: block;
      text-align: center;
      padding: 10px 22px;
      margin: 4px 22px 16px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s;
    }
    .card:nth-child(3) .card-link {
      background: #FBE9E7;
      color: #BF360C;
    }
    .card:nth-child(3) .card-link:hover {
      background: #FFCCBC;
    }

    /* ── 하단 정보 카드 ── */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 980px;
      margin: 20px auto 0;
    }
    @media (max-width: 560px) {
      .info-grid { grid-template-columns: 1fr; }
    }
    .info-card {
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
      overflow: hidden;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .info-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.11);
    }
    .info-card-header {
      padding: 14px 22px;
    }
    .info-card-header h3 {
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
    }
    .info-card--hana .info-card-header {
      background: linear-gradient(135deg, #00796B, #26A69A);
    }
    .info-card--kt .info-card-header {
      background: linear-gradient(135deg, #C62828, #EF5350);
    }
    .info-card-body {
      padding: 14px 22px 18px;
      font-size: 0.88rem;
      color: #3a4a5e;
      line-height: 1.6;
    }
    .info-card-body a {
      display: inline-block;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 4px;
    }
    .info-card--kt .info-card-body a {
      display: block;
      text-align: center;
      padding: 10px 22px;
      margin: 0 0 6px;
      border-radius: 10px;
      background: #FFEBEE;
      color: #C62828;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s;
    }
    .info-card--kt .info-card-body a:hover {
      background: #FFCDD2;
    }
    .info-card-body .hint {
      font-size: 0.8rem;
      color: #8a96a8;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🍽️ SAP Korea 근처 구내식당 식단표 🍽️</h1>
    <div class="date-badge" id="dateBadge">불러오는 중…</div>
  </header>

  <div id="app">
    <div class="state">
      <div class="spinner"></div>
      메뉴를 불러오는 중입니다…
    </div>
  </div>

  <!-- 하단 정보 카드 -->
  <div class="info-grid">
    <div class="info-card info-card--hana">
      <div class="info-card-header">
        <h3>📍 하나증권</h3>
      </div>
      <div class="info-card-body">
        mealcare 앱 → 하나증권 여의도점 검색
      </div>
    </div>
    <div class="info-card info-card--kt">
      <div class="info-card-header">
        <h3>📍 KT</h3>
      </div>
      <div class="info-card-body">
        <a href="http://pf.kakao.com/_bwyrs" target="_blank" rel="noopener">🔗 카카오톡 채널 바로가기</a>
        <div class="hint">(KT그룹희망나눔재단 여의도점 카카오톡 채널 → 주간식단표 확인)</div>
      </div>
    </div>
  </div>

  <div style="text-align:center; margin-top:28px;">
    <button class="refresh-btn" onclick="loadMenu()">
      ↻ 새로고침
    </button>
  </div>

  <footer id="lastUpdated"></footer>

  <script>
    // GitHub API를 사용하면 CDN 캐시 우회 가능 (raw.githubusercontent.com은 캐시 지연 있음)
    const API_URL = 'https://api.github.com/repos/eugeneelee103/SAPLunchMap/contents/feed.xml';

    async function loadMenu() {
      const app = document.getElementById('app');
      document.getElementById('dateBadge').textContent = '불러오는 중…';
      app.innerHTML = '<div class="state"><div class="spinner"></div>메뉴를 불러오는 중입니다…</div>';

      try {
        // Accept: application/vnd.github.v3.raw → 파일 원본 직접 반환, 항상 최신
        const res = await fetch(API_URL, {
          headers: { 'Accept': 'application/vnd.github.v3.raw' },
          cache: 'no-store'
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const xmlText = await res.text();

        const parser = new DOMParser();
        const xml = parser.parseFromString(xmlText, 'text/xml');
        const item = xml.querySelector('item');
        if (!item) throw new Error('메뉴 항목을 찾을 수 없습니다.');

        const title       = item.querySelector('title')?.textContent ?? '';
        const description = item.querySelector('description')?.textContent ?? '';
        const pubDate     = item.querySelector('pubDate')?.textContent ?? '';

        // 날짜 뱃지 업데이트
        const dateLabel = title.replace(/\s*🍽️?\s*/g, '').replace('점심 메뉴', '').trim();
        document.getElementById('dateBadge').textContent = dateLabel + ' 점심';

        // last updated
        document.getElementById('lastUpdated').textContent =
          pubDate ? `최종 업데이트: ${formatDate(pubDate)}` : '';

        const restaurants = parseDescription(description);

        if (restaurants.length === 0) {
          app.innerHTML = '<div class="state">오늘 메뉴 정보가 없습니다.</div>';
          return;
        }

        app.innerHTML = `<div class="grid">${restaurants.map(renderCard).join('')}</div>`;

      } catch (err) {
        app.innerHTML = `<div class="state">메뉴를 불러오지 못했습니다.<br><small>${err.message}</small></div>`;
      }
    }

    /* ── 파서 ── */
    function parseDescription(text) {
      // 📍 기준으로 식당 블록 분리
      const blocks = text.split(/📍\s+/).filter(b => b.trim());

      return blocks.map(block => {
        const lines = block.split('\n').map(l => l.trim()).filter(l => l);
        const name  = lines[0];
        const items = [];

        let i = 1;
        while (i < lines.length) {
          const line = lines[i];
          let corner  = '';
          let mainName = line;

          // [코너명] 메인메뉴명 형태 파싱
          const m = line.match(/^\[([^\]]+)\]\s*(.*)/);
          if (m) {
            corner   = m[1];
            mainName = m[2];
          }

          // 다음 줄이 반찬(사이드)인지 확인 — [로 시작하지 않으면 반찬
          let sides = '';
          if (i + 1 < lines.length && !lines[i + 1].startsWith('[')) {
            sides = lines[i + 1];
            i++;
          }

          if (mainName) items.push({ corner, name: mainName, sides });
          i++;
        }

        return { name, items };
      });
    }

    /* ── 카드 렌더 ── */
    const RESTAURANT_LINKS = {
      'IFC 서울': 'https://welplan.pmh.codes/restaurants/welstory/REST000100/ifc%EC%84%9C%EC%9A%B8'
    };

    function renderCard(restaurant) {
      const itemsHTML = restaurant.items.length
        ? restaurant.items.map(it => `
            <div class="menu-item">
              ${it.corner ? `<span class="corner-badge">${it.corner}</span>` : ''}
              <div class="menu-name">${it.name || '–'}</div>
              ${it.sides ? `<div class="menu-sides">${it.sides}</div>` : ''}
            </div>`).join('')
        : '<p class="no-menu">메뉴 정보 없음</p>';

      const link = RESTAURANT_LINKS[restaurant.name];
      const linkHTML = link
        ? `<a class="card-link" href="${link}" target="_blank" rel="noopener">🔗 식단표 바로가기</a>`
        : '';

      return `
        <div class="card">
          <div class="card-header">
            <h2>📍 ${restaurant.name}</h2>
          </div>
          <div class="card-body">${itemsHTML}</div>
          ${linkHTML}
        </div>`;
    }

    /* ── pubDate 포맷 ── */
    function formatDate(str) {
      try {
        const d = new Date(str);
        return d.toLocaleString('ko-KR', {
          year: 'numeric', month: 'long', day: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });
      } catch { return str; }
    }

    // 최초 로드
    loadMenu();
  </script>
</body>
</html>
